[package]
name = "snake-engine"
version = "0.1.0"
edition = "2024"

[dependencies.vulkano]
version = "0.35.2"

[dependencies]
vulkano-shaders = "0.35.0"
glam = { version = "0.33.1" }
rayon = "1.12"
#fontdue = "0.9.3"
ab_glyph = "0.2.32"
tracing = "0.1"
tracing-subscriber = "0.3"
rapier2d = "0.32.0"
color = { version = "0.3.2", features = ["bytemuck"] }
strum = { version = "0.28", features = ["derive"] }
image = "0.25"
rust-embed = "8.11.0"
tracy-client = { version = "0.18.4", default-features = false, features = ["enable", "ondemand", "broadcast", "crash-handler"] }


[dependencies.winit]
version = "0.30.12"
features = ["rwh_06"]

[dependencies.anyhow]
version = "1.0"

[profile.dev]
opt-level = 0 

[profile.dev.package.tracy-client]
opt-level = 3
